<svg xmlns="http://www.w3.org/2000/svg" width="780" height="2390" viewBox="0 0 780 2390" role="img" aria-labelledby="title desc">
  <title id="title">一项 REQ 的工作路径，竖版</title>
  <desc id="desc">S0 至 S5 是谋划，其中 S5 回看 S3 与 S4，并追溯需求和设计。S6 至 S9 是实现与验证；发现问题时进入 S8、S9，再返回新一轮 S7。S7 通过后进入 S10 和 S11。</desc>
  <defs>
    <pattern id="grain" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="4" cy="9" r="0.8" fill="#b9b5a9" opacity=".38"/><circle cx="22" cy="23" r=".65" fill="#b9b5a9" opacity=".25"/></pattern>
